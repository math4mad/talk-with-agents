name: Render and publish to gh-pages

on:
  push:
    branches: main
  workflow_dispatch:

# quarto-actions/publish needs to push the rendered site onto gh-pages,
# and GitHub Pages has to be able to read it.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Figures + the experiment behind coding/snippets/ run on plain numpy/scipy,
      # so CI never needs torch.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install figure / experiment dependencies
        run: python -m pip install --upgrade pip numpy scipy matplotlib pandas polars

      - name: Regenerate every figure (300 dpi PNG + vector PDF)
        run: python scripts/make_figures.py
      - name: Re-run the space-search experiment (writes output/*.csv the pages quote)
        run: python scripts/space_search_demo.py

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      # Publishes the rendered site to the gh-pages branch of this repository.
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
